/* ---------- parsing ---------- */
const NS='urn:schemas-microsoft-com:office:spreadsheet';
function rowsFromXml(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  if(doc.getElementsByTagName('parsererror').length||!doc.getElementsByTagNameNS(NS,'Row').length)throw new Error('xml');
  const out=[];
  for(const r of doc.getElementsByTagNameNS(NS,'Row')){
    const cells=[];
    for(const c of r.getElementsByTagNameNS(NS,'Cell')){
      const d=c.getElementsByTagNameNS(NS,'Data')[0];const v=d?d.textContent.trim():'';if(v!=='')cells.push(v)}
    out.push(cells)}
  return out}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Gagal memuat pustaka Excel'));document.head.appendChild(s)})}
async function rowsFromBuffer(buf){
  const head=new TextDecoder('windows-1252').decode(new Uint8Array(buf,0,Math.min(300,buf.byteLength)));
  if(head.includes('<?xml')||head.includes('<Workbook')){
    return rowsFromXml(new TextDecoder('windows-1252').decode(buf))}
  if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const wb=XLSX.read(buf,{type:'array'});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
  return aoa.map(r=>r.map(v=>String(v).trim()).filter(v=>v!==''))}
function parseRows(rows){
  const s={kantor:'',nama:'',bulan:0,tahun:0,cetak:'',jam:'',rows:[]};let prod='';
  const num=v=>parseFloat(v)||0;
  for(const c of rows){
    if(!c.length)continue;const a=c[0];let m;
    if((m=/Bulan\s*:\s*(\d+)\s*Tahun\s*:\s*(\d+)/.exec(a))){s.bulan=+m[1];s.tahun=+m[2]}
    else if(a==='Tanggal Cetak')s.cetak=c[2]||'';
    else if(a==='Jam Cetak')s.jam=c[2]||'';
    else if(!s.kantor&&(m=/Kantor\s*:\s*(\d+)\s*\/\s*(.+?)\s*$/.exec(a))){s.kantor=m[1];s.nama=m[2]}
    else if(c.length===1&&(m=/^(\d{3})\s*\/\s*(.+)$/.exec(a)))prod=m[1]+' '+m[2];
    else if(/^\d{12}$/.test(a)&&c.length>=17){
      s.rows.push({rek:a,nama:c[1],plafond:num(c[2]),os:num(c[3]),coll:parseInt(c[5])||0,
        ta:num(c[6])+((parseInt(c[14])||0)>0||(parseInt(c[5])||0)>0?num(c[7]):0),tagihan:num(c[9]),masuk:num(c[11]),takhir:num(c[13]),bln:parseInt(c[14])||0,
        jt:c[15],ao:c[16]||'',prod:a.slice(0,3),prodNama:prod})}}
  if(!s.rows.length)throw new Error('Tidak ada baris rekening yang dikenali. Pastikan ini laporan "Tagihan Mitra Usaha".');
  if(!s.bulan||!s.tahun){const d=pd(s.cetak);if(d){s.bulan=d.getMonth()+1;s.tahun=d.getFullYear()}}
  return s}

/* ---------- analisis ---------- */
const RULES={
  BERHENTI:{cat:'baru',label:'Baru berhenti bayar',sc:85},
  CAIR:{cat:'baru',label:'Tidak ada angsuran pada bulan ke-3 setelah pencairan',sc:95},
  MEMBURUK:{cat:'baru',label:'Kolektibilitas memburuk',sc:60},
  KRONIS:{cat:'kronis',label:'Menunggak kronis',sc:30},
  JT_LEWAT:{cat:'kronis',label:'Lewat jatuh tempo, masih ada saldo',sc:40},
  SEBAGIAN:{cat:'kronis',label:'Setoran sebagian',sc:30},
  MIRIP:{cat:'kontrol',label:'Nama mirip petugas',sc:85},
  TANPA_AO:{cat:'kontrol',label:'AO tidak tercatat',sc:50},
  LEBIH:{cat:'kontrol',label:'Setoran melebihi kewajiban',sc:40},
  GANDA:{cat:'kontrol',label:'Nama sama di beberapa rekening',sc:20},
  DATA:{cat:'kontrol',label:'Saldo 0 tapi ada tagihan',sc:30}};
const CATS={baru:'Perilaku baru',kronis:'Kondisi kronis',kontrol:'Kontrol & data'};
const norm=s=>String(s).toUpperCase().replace(/[^A-Z]/g,'');
function bigrams(s){const m=new Map();for(let i=0;i<s.length-1;i++){const g=s.substr(i,2);m.set(g,(m.get(g)||0)+1)}return m}
function dice(a,b){if(a.length<2||b.length<2)return 0;const A=bigrams(a),B=bigrams(b);let x=0;for(const[g,n]of A)x+=Math.min(n,B.get(g)||0);return 2*x/(a.length+b.length-2)}
const idxCache=new WeakMap();
function idx(s){let m=idxCache.get(s);if(!m){m=new Map(s.rows.map(r=>[r.rek,r]));idxCache.set(s,m)}return m}
function periodKey(s){return s.kantor+'|'+s.tahun+'-'+String(s.bulan).padStart(2,'0')}
function prevSnaps(snap){
  const k=snap.tahun*12+snap.bulan;
  return Object.values(mem.snaps).filter(x=>x.kantor===snap.kantor&&x.tahun*12+x.bulan<k).sort((a,b)=>(b.tahun*12+b.bulan)-(a.tahun*12+a.bulan))}

function analyze(snap){
  const st=mem.settings,cr=pd(snap.cetak),cetak=(cr&&cr.getFullYear()===snap.tahun&&cr.getMonth()===snap.bulan-1)?cr:new Date(snap.tahun,snap.bulan,0),printDay=cetak.getDate();
  const hist=prevSnaps(snap);
  const prev=hist[0]||null;const gap=prev?(snap.tahun*12+snap.bulan)-(prev.tahun*12+prev.bulan):0;const pl=gap===1?'bulan lalu':'periode '+(prev?BLN[prev.bulan]:'');
  const loans=snap.rows.filter(r=>r.prod!=='111');
  const staff=[...new Set(snap.rows.map(r=>r.ao).filter(a=>a&&a!=='TANPA NAMA'))].map(a=>({a,n:norm(a)}));
  const nameCount=new Map();for(const r of loans){const k=norm(r.nama);nameCount.set(k,(nameCount.get(k)||0)+1)}
  const out=[];
  for(const r of loans){
    const f=[];const jt=pd(r.jt);const dueDay=jt?jt.getDate():1;
    const duePassed=!st.duePass||dueDay<=printDay;
    const owedNow=r.ta+(duePassed?r.tagihan:0);
    const noPay=r.masuk===0&&owedNow>0;
    const pctOs=r.plafond>0?r.os/r.plafond*100:0;
    const add=(id,txt)=>f.push({id,txt});
    const old=prev&&idx(prev).get(r.rek);
    // streak pembayaran beruntun sebelumnya
    let streak=0;if(hist.length){let k=snap.tahun*12+snap.bulan;for(const h of hist){if(h.tahun*12+h.bulan!==k-1)break;const o=idx(h).get(r.rek);if(o&&o.masuk>0&&o.ta===0)streak++;else break;k--}}
    let seenB=0,paidB=0;for(const h of hist.slice(0,4)){const o=idx(h).get(r.rek);if(o){seenB++;if(o.masuk>0)paidB++}}
    // Gunakan bulan pertama rekening muncul di laporan sebagai perkiraan bulan pencairan.
    const currentPeriod=snap.tahun*12+snap.bulan;
    const firstSeen=hist.slice().reverse().find(h=>idx(h).has(r.rek));
    const monthsAfterFirstSeen=firstSeen?currentPeriod-(firstSeen.tahun*12+firstSeen.bulan):0;
    if(monthsAfterFirstSeen===3&&r.masuk===0&&duePassed&&owedNow>0){
      add('CAIR','Rekening muncul pertama kali pada '+BLN[firstSeen.bulan]+' '+firstSeen.tahun+'. Pada bulan ke-3 setelah itu, angsuran sudah jatuh tempo tetapi belum ada setoran. Verifikasi tanggal pencairan dan jadwal angsuran; ini indikasi awal, bukan kesimpulan pelanggaran.')}
    // 2. berhenti bayar
    else if(r.ta===0&&r.tagihan>0&&duePassed&&r.masuk===0&&r.coll<=1){
      add('BERHENTI','Bulan lalu tidak ada tunggakan, bulan ini tagihan '+rp(r.tagihan)+' (jatuh tempo tgl '+dueDay+') belum ada setoran'+(streak?'. Sebelumnya membayar '+streak+' bulan berturut-turut.':'.'))}
    else if(old&&old.masuk>0&&old.ta===0&&noPay&&r.coll<=2){
      add('BERHENTI','Pada '+pl+' membayar '+rp(old.masuk)+', periode ini tidak ada setoran padahal kewajiban '+rp(owedNow)+'.')}
    else if(seenB>=2&&paidB>=2&&noPay&&r.coll<=2){
      add('BERHENTI','Pada '+paidB+' dari '+seenB+' periode sebelumnya ada setoran, periode ini tidak ada setoran padahal kewajiban '+rp(owedNow)+'.')}
    // 3. memburuk
    if(old&&r.coll-old.coll>=2)add('MEMBURUK','Kolektibilitas naik dari '+old.coll+' ke '+r.coll+' sejak '+pl+'.');
    // kronis
    if(r.coll>=3||r.bln>=st.blnKronis){
      add('KRONIS','Kolektibilitas '+r.coll+', menunggak '+r.bln+' bulan, tunggakan akhir '+rp(r.takhir)+(r.masuk===0?'. Tidak ada setoran bulan ini.':'.'))}
    if(jt&&jt<cetak&&r.os>0)add('JT_LEWAT','Jatuh tempo '+r.jt+', saldo masih '+rp(r.os)+'. Periksa apakah ada perpanjangan atau restrukturisasi yang tercatat.');
    if(r.masuk>0&&owedNow>0&&r.masuk<0.5*owedNow&&r.coll<3)add('SEBAGIAN','Setoran '+rp(r.masuk)+' hanya '+Math.round(r.masuk/owedNow*100)+'% dari kewajiban '+rp(owedNow)+'.');
    // kontrol
    if(r.ao==='TANPA NAMA')add('TANPA_AO','Rekening tidak punya nama AO'+(r.plafond>=100e6?' dan plafond '+rpc(r.plafond)+'.':'.'));
    let best=null;for(const s of staff){const d=dice(norm(r.nama),s.n);if(!best||d>best.d)best={d,a:s.a}}
    if(best&&best.d*100>=st.mirip)add('MIRIP','Nama debitur mirip dengan petugas "'+best.a+'" (kemiripan '+Math.round(best.d*100)+'%). Periksa hubungan dan prosedur persetujuan.');
    if(r.masuk>owedNow+r.tagihan*(duePassed?0:1)+1&&r.masuk>r.ta+r.tagihan+1)add('LEBIH','Setoran '+rp(r.masuk)+' lebih besar dari kewajiban '+rp(r.ta+r.tagihan)+'. Periksa sumber setoran.');
    if((nameCount.get(norm(r.nama))||0)>1)add('GANDA','Nama yang sama muncul di '+nameCount.get(norm(r.nama))+' rekening pembiayaan. Bisa orang berbeda.');
    if(r.os===0&&r.plafond>0&&(r.tagihan>0||r.ta>0))add('DATA','Outstanding 0 tetapi masih ada tagihan '+rp(r.tagihan+r.ta)+'.');
    let score=0,mx=0;
    for(const x of f){let s=RULES[x.id].sc;
      if(x.id==='KRONIS')s=30+(r.coll>=4?10:0)+Math.min(r.bln,20)/4;
      if(x.id==='TANPA_AO')s=r.plafond>=100e6?70:(pctOs>=99?60:50);
      x.sc=s;mx=Math.max(mx,s);score+=s}
    score=f.length?Math.min(100,mx+0.15*(score-mx)):0;
    out.push({r,f,score,sev:score>=75?'hi':score>=45?'mid':'lo',duePassed,dueDay,noPay,pctOs});
  }
  // perubahan antar bulan
  let chg=null;
  if(prev){const cur=new Set(snap.rows.map(r=>r.rek));
    chg={prev,baru:snap.rows.filter(r=>!idx(prev).has(r.rek)&&r.prod!=='111'),
      hilang:prev.rows.filter(r=>!cur.has(r.rek)&&r.prod!=='111'),ao:{}};
    for(const r of loans){const o=idx(prev).get(r.rek);if(o&&o.ao!==r.ao){const k=o.ao+' → '+r.ao;chg.ao[k]=(chg.ao[k]||0)+1}}}
  return {items:out,chg,loans,printDay}}

let S={mut:'baru',queue:[],year:0,metric:'n',asTable:false,cur:null,tab:'ringkas',sheet:null,sq:'',sao:'',sshow:60,open:new Set(),f:{q:'',sev:'',cat:'',ao:'',prod:'',sort:'score',show:50},err:'',busy:false};
let A=null;
function curSnap(){const k=S.cur&&mem.snaps[S.cur];return k||null}
function pickLatest(){const ks=Object.keys(mem.snaps).sort((a,b)=>{const x=mem.snaps[a],y=mem.snaps[b];return(y.tahun*12+y.bulan)-(x.tahun*12+x.bulan)});S.cur=ks[0]||null}

async function ingest(files){
  S.err='';S.busy=true;render();const ok=[];
  for(const file of files){
    try{const snap=parseRows(await rowsFromBuffer(await file.arrayBuffer()));snap.fileName=file.name;ok.push(snap)}
    catch(e){S.err+=(S.err?' ':'')+file.name+': '+(e.message==='xml'?'File tidak bisa dibaca sebagai laporan. Simpan ulang dari sistem sebagai .xls tanpa diubah.':e.message)}}
  S.queue=S.queue.concat(ok);S.busy=false;render()}
function confirmPending(){
  const s=S.queue.shift();s.bulan=+s.bulan;s.tahun=+s.tahun;const k=periodKey(s);const had=!!mem.snaps[k];
  mem.snaps[k]=s;save();S.cur=k;S.year=s.tahun;S.open.clear();S.f.show=50;recompute();
  toast((had?'Menggantikan data ':'Tersimpan: ')+BLN[s.bulan]+' '+s.tahun);render()}

function collChart(snap,y,metric){
  const mine=Object.values(mem.snaps).filter(s=>s.kantor===snap.kantor&&s.tahun===y);
  const data=MON.map((_,i)=>{const s=mine.find(x=>x.bulan===i+1);if(!s)return null;const c=[0,0,0,0,0];s.rows.filter(r=>r.prod!=='111').forEach(r=>{c[Math.min(4,r.coll)]+=metric==='n'?1:r.os});return{s,c,t:c.reduce((a,b)=>a+b,0)}});
  const fmt=v=>metric==='n'?nf.format(v):rpc(v);
  const W=720,H=250,L=52,R=6,T=22,B=28,pw=W-L-R,ph=H-T-B,mx=niceMax(Math.max(...data.map(d=>d?d.t:0),1));
  const Y=v=>T+ph-v/mx*ph,bw=pw/12*0.6;let g='';
  for(let k=0;k<=4;k++){const v=mx*k/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="12" fill="var(--ink3)">'+(metric==='n'?nf.format(v):rpc(v).replace('Rp ',''))+'</text>'}
  data.forEach((d,i)=>{const cx=L+pw/12*(i+.5);
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="'+(d?'var(--ink2)':'var(--ink3)')+'">'+MON[i]+'</text>';
    if(!d)return;let acc=0;
    d.c.forEach((v,k)=>{if(!v)return;const y0=Y(acc+v),hh=Y(acc)-y0;acc+=v;
      g+='<rect x="'+(cx-bw/2)+'" y="'+y0+'" width="'+bw+'" height="'+Math.max(hh,0)+'" rx="2" fill="var(--c'+k+')" stroke="var(--surface)" stroke-width="2" style="cursor:pointer" data-per="'+esc(periodKey(d.s))+'" data-k="'+k+'" data-tip="'+BLN[i+1]+' '+y+' · Coll '+k+': '+fmt(v)+' ('+(d.t?(v/d.t*100).toFixed(1).replace('.',','):0)+'%)"/>'});
    g+='<text x="'+cx+'" y="'+(Y(d.t)-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+(metric==='n'?nf.format(d.t):rpc(d.t).replace('Rp ',''))+'</text>'});
  return'<svg id="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Rekening per Coll tiap bulan tahun '+y+'">'+g+'</svg><div class="legend">'+[0,1,2,3,4].map(k=>'<span><i style="background:var(--c'+k+')"></i>Coll '+k+'</span>').join('')+'</div>'}
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}

  // migrasi

  if(!c)return h+'<div class="card"><h2>Perpindahan Coll belum tersedia</h2><p class="muted">Dibutuhkan satu periode sebelum '+BLN[snap.bulan]+' '+snap.tahun+' untuk cabang ini.</p></div>';
  const M=Array.from({length:6},()=>Array(6).fill(0));
  const pk=idx(c.prev);
  for(const r of A.loans){const o=pk.get(r.rek);M[o?Math.min(4,o.coll):5][Math.min(4,r.coll)]++}
  for(const r of c.hilang)M[Math.min(4,r.coll)][5]++;
  let wor=0,bet=0,same=0;for(let a=0;a<5;a++)for(let b=0;b<5;b++){if(b>a)wor+=M[a][b];else if(b<a)bet+=M[a][b];else same+=M[a][b]}
  const lab=['Coll 0','Coll 1','Coll 2','Coll 3','Coll 4','Baru'];
  h+='<div class="card"><h2>Diagram perpindahan Coll: '+BLN[c.prev.bulan]+' '+c.prev.tahun+' → '+BLN[snap.bulan]+' '+snap.tahun+'</h2><p class="muted small" style="margin-bottom:8px">Baris = posisi periode sebelumnya, kolom = posisi sekarang. Sel merah = naik ke Coll lebih tinggi. Memburuk <b>'+wor+'</b> · membaik <b>'+bet+'</b> · tetap <b>'+same+'</b> rekening.</p>'+
   '<div class="tblbox mig"><table><thead><tr><th>Dari \\ Ke</th>'+[0,1,2,3,4].map(k=>'<th>Coll '+k+'</th>').join('')+'<th>Hilang</th></tr></thead><tbody>'+
   M.map((row,a)=>'<tr><td>'+lab[a]+'</td>'+row.map((v,b)=>'<td class="'+(!v?'z':(a<5&&b<5&&b>a)?'w':'')+'">'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>';
  const byRek=new Map(A.items.map(i=>[i.r.rek,i])),up=[],down=[];
  for(const r of A.loans){const old=pk.get(r.rek);if(!old||old.coll===r.coll)continue;const item=byRek.get(r.rek);if(!item)continue;
    const move={item,from:old.coll,to:r.coll};(r.coll>old.coll?up:down).push(move)}
  const movementCard=(title,moves,rising)=>'<div class="card"><h2>'+title+' ('+moves.length+')</h2>'+(moves.length?'<div class="list">'+moves.sort((a,b)=>Math.abs(b.to-b.from)-Math.abs(a.to-a.from)).map(m=>{const i=m.item,r=i.r,open=S.open.has(r.rek);return'<div class="item"><button class="row" data-rek="'+esc(r.rek)+'" aria-expanded="'+open+'"><span class="sev '+(rising?'hi':'lo')+'">'+(rising?'Naik':'Turun')+'</span><span class="who"><b>'+esc(r.nama)+'</b><span class="mono">'+esc(r.rek)+'</span></span><span class="amt">Coll '+m.from+' → '+m.to+'<small>'+esc(r.ao)+' · '+rpc(r.os)+'</small></span></button>'+(open?detailHtml(i):'')+'</div>'}).join('')+'</div>':'<p class="muted small">Tidak ada rekening.</p>')+'</div>';
  h+='<div class="cols">'+movementCard('Coll naik / memburuk',up,true)+movementCard('Coll turun / membaik',down,false)+'</div>';
  return h+rekapHtml()}
const plabel=z=>MON[z.bulan-1]+' '+z.tahun;
function mutasiData(){
  const snap=curSnap(),c=A.chg;if(!c)return null;
  const asc=Object.values(mem.snaps).filter(x=>x.kantor===snap.kantor&&x.tahun*12+x.bulan<=snap.tahun*12+snap.bulan).sort((a,b)=>(a.tahun*12+a.bulan)-(b.tahun*12+b.bulan));
  const pi=idx(c.prev);
  const baru=A.items.filter(i=>!pi.has(i.r.rek)).map(i=>{const r=i.r,n=[];
    if(r.masuk===0&&(r.ta>0||(r.tagihan>0&&i.duePassed)))n.push('Belum ada setoran');
    if(r.ao==='TANPA NAMA')n.push('AO tidak tercatat');
    if(r.plafond>=100e6)n.push('Plafond besar');
    if(i.f.some(x=>x.id==='MIRIP'))n.push('Nama mirip petugas');
    return{i,note:n.join(' · '),sev:i.sev}});
  const cands=[];
  for(const i of A.items){const r=i.r,o=pi.get(r.rek);if(r.os<=0&&r.plafond>0&&o&&o.os>0)cands.push(r.rek)}
  for(const o of c.hilang)cands.push(o.rek);
  const lunas=cands.map(rek=>{
    const seq=asc.map(z=>({z,r:idx(z).get(rek)}));
    let li=-1;for(let k=seq.length-1;k>=0;k--){if(seq[k].r&&seq[k].r.os>0){li=k;break}}
    const base=li>=0?seq[li].r:seq.slice().reverse().find(q=>q.r).r;
    let zero=null;for(let k=li+1;k<seq.length;k++){if(seq[k].r&&seq[k].r.os<=0){zero=seq[k].z;break}}
    let exitS=zero;if(!exitS){for(let k=li+1;k<seq.length;k++){if(!seq[k].r){exitS=seq[k].z;break}}}
    if(!exitS)exitS=snap;
    const sisa=li>=0?seq[li].r.os:0,sisaPer=li>=0?plabel(seq[li].z):'';
    const jt=pd(base.jt),exitEnd=new Date(exitS.tahun,exitS.bulan,0);let sev,note;
    if(zero){if(jt&&jt>exitEnd){sev='mid';note='Saldo menjadi 0 sebelum jatuh tempo ('+base.jt+'). Lunas dipercepat, cek bukti pelunasan.'}else{sev='lo';note='Saldo menjadi 0 pada atau sesudah jatuh tempo. Lunas.'}}
    else if(base.coll>=3&&sisa>0){sev='hi';note='Hilang dari laporan saat Coll '+base.coll+' tanpa saldo 0 tercatat. Perlu bukti hapus buku atau penyelesaian.'}
    else if(jt&&jt<=exitEnd){sev='lo';note='Hilang dari laporan setelah jatuh tempo. Kemungkinan lunas.'}
    else{sev='mid';note='Hilang dari laporan sebelum jatuh tempo ('+base.jt+') tanpa saldo 0 tercatat. Cek bukti pelunasan.'}
    if(li<0)note+=' Saldo sebelum pelunasan tidak ada di riwayat yang diunggah.';
    return{r:base,sisa,sisaPer,periode:plabel(exitS),zero:!!zero,sev,note,unknown:li<0}});
  return{baru,lunas}}
function lunasDetail(l){const r=l.r;

function rekapHtml(){
  const snap=curSnap(),sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
  const all=Object.values(mem.snaps).filter(x=>x.kantor===snap.kantor).sort((a,b)=>(a.tahun*12+a.bulan)-(b.tahun*12+b.bulan));

   all.slice(1).map((cur,i)=>{const pv=all[i],pi=idx(pv),ci=idx(cur);const L=x=>x.rows.filter(r=>r.prod!=='111');

function tabAO(){
  const by=new Map();

  const ios=/iphone|ipad|ipod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const mobile=ios||/android/.test(ua);
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone||sessionStorage.getItem('pengawasan-install-dismissed'))return;
  if(ios){
    message.textContent='Ketuk Bagikan di Safari, lalu pilih Tambahkan ke Layar Utama.';
    banner.hidden=false;
  }else if(mobile){
    message.textContent='Tambahkan aplikasi ke layar utama dari menu browser.';
    banner.hidden=false;
  }
  let installEvent=null;
  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();installEvent=event;
    message.textContent='Pasang aplikasi agar mudah dibuka dari layar utama.';
    action.hidden=false;banner.hidden=false;
  });
  action.addEventListener('click',async()=>{
    if(!installEvent)return;
    installEvent.prompt();
    await installEvent.userChoice;
    installEvent=null;action.hidden=true;
  });
  close.addEventListener('click',()=>{banner.hidden=true;sessionStorage.setItem('pengawasan-install-dismissed','1')});
  window.addEventListener('appinstalled',()=>{banner.hidden=true;sessionStorage.setItem('pengawasan-install-dismissed','1')});
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script>
</body></html>
